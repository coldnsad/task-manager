spring.application.name=api-gateway
server.port=9090

# Registration in Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

#Load balanced settings
spring.cloud.loadbalancer.ribbon.enabled=false
spring.cloud.loadbalancer.enabled=true

#Property for discovery services with eureka
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

#Routes
spring.cloud.gateway.server.webflux.routes[0].id=task-manager-service
#lb - load balanced in eureka
spring.cloud.gateway.server.webflux.routes[0].uri=lb://task-manager-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/**

# Filter fallback for Task Manager with circuit breaker
spring.cloud.gateway.server.webflux.routes[0].filters[0]=CircuitBreakerLoadBalancerFilter=taskManagerCircuitBreaker
#spring.cloud.gateway.server.webflux.routes[0].filters[0]=CircuitBreaker=taskManagerCircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=taskManagerCircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/task-manager

# Actuator Configuration(for specific information about gateway)
management.endpoints.web.exposure.include=health,info,gateway,circuitbreakers
management.endpoint.circuitbreakers.enabled=true
#This property allows to get access to http://localhost:9090/actuator/gateway/routes
management.endpoint.gateway.access=read_only
management.endpoint.health.show-details=always

#Resilience4j Actuator
management.endpoint.resilience4jcircuitbreakers.enabled=true
management.endpoint.resilience4jcircuitbreakerscache.enabled=true

#Detailed Circuit Breaker Settings
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.instances.taskManagerCircuitBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.taskManagerCircuitBreaker.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.taskManagerCircuitBreaker.sliding-window-size=5
#in %
resilience4j.circuitbreaker.instances.taskManagerCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.taskManagerCircuitBreaker.record-exceptions=java.lang.Throwable

#Logging
logging.level.io.github.resilience4j=TRACE
logging.level.reactor.core.publisher=DEBUG

